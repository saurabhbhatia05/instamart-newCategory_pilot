[theme]
primaryColor = "#7c3aed"
backgroundColor = "#faf8ff"
secondaryBackgroundColor = "#ede9fe"
textColor = "#1e1b4b"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
